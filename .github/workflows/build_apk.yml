name: Build Badminton NameCard Finder APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # GitHub 웹 화면에서 'Run workflow' 버튼 클릭으로 즉시 수동 빌드 가능

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v4

      - name: Java 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Flutter 환경 설정
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: 의존성 패키지 다운로드
        run: flutter pub get

      - name: Release APK 빌드
        run: flutter build apk --release

      - name: 완성된 APK 파일 업로드 (다운로드 제공)
        uses: actions/upload-artifact@v4
        with:
          name: badminton-nametag-app
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
