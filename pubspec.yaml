name: find_nametag
description: "A badminton club namecard automatic detection Flutter app using on-device Korean ML Kit OCR and Hangul fuzzy matching."
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # On-device Korean ML Kit Text Recognition
  google_mlkit_text_recognition: ^0.13.0

  # Camera & Image Picking
  image_picker: ^1.1.2
  camera: ^0.11.0+1

  # Utilities
  collection: ^1.18.0
  uuid: ^4.4.0
  intl: ^0.19.0
  path: ^1.9.0
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1E222B"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
